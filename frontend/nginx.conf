server {
    listen 80;
    
    # Serve files from the Nginx default directory
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # This is critical for React Router (Single Page Applications)
        # It ensures that if a file or directory isn't found, it falls back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Error handling
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
