apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: chaviii/backend:latest
        imagePullPolicy: Always
        envFrom:
        - secretRef:
            name: backend-secrets
        ports:
        - containerPort: 3000
